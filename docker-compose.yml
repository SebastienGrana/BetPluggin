services:
  betpluggin:
    build: .
    env_file:
      - .env
    volumes:
      - .:/project
      # PyPlanet's LocalDriver storage assumes it shares a filesystem with the dedicated server (it
      # writes to the exact absolute path the server reports for itself, e.g. for mx/dedimania map
      # downloads) -- same host folder, same path as tm-dedicated below, or those plugins fail with
      # "Can't check or create folder".
      #
      # Bind-mounted to a host folder (not a named volume) as of 2026-08-03: the OnZ Bot's mapupload
      # feature (a separate Java project, see its docker/tm-dedicated-userdata sibling comment below)
      # needs to write map files here directly from the host, bypassing XML-RPC's WriteFile -- which
      # is broken on this dedicated server build, see OnZ Bot's mapupload/context.txt. A named volume
      # isn't reachable from a plain host process; a bind mount is.
      - ./docker/tm-dedicated-userdata:/app/dedicated/UserData
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tm-dedicated:
        condition: service_started
        required: false

  # PyPlanet needs a real (async-capable) database -- peewee_async only supports MySQL/PostgreSQL,
  # not SQLite. MariaDB speaks the MySQL protocol (works with PyPlanet's old pinned mysql drivers)
  # without mysql:5.7's broken entrypoint script or MySQL 8's incompatible default auth plugin.
  # Internal-only, never exposed to the host, so plain default credentials are fine.
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pyplanet
      MYSQL_USER: pyplanet
      MYSQL_PASSWORD: pyplanet
      MYSQL_ROOT_PASSWORD: pyplanet
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local dev-only Trackmania2 Stadium (ManiaPlanet) dedicated server, so we can build/test BetPluggin
  # without touching the real ManiaServ-hosted server. Only starts with `docker compose --profile dev up`.
  # Official image maintained by the PyPlanet team: https://github.com/PyPlanet/maniaplanet-docker
  # Requires a free dedicated server login: https://maniaplanet.com/account/dedicated-servers
  #
  # Uses non-default ports (2360/3460/5010, via docker/tm-dedicated-config.txt): the ManiaPlanet *game
  # client* itself holds 2350 and 127.0.0.1:5000 while running, so a server on the default ports
  # collides with it and joins silently resolve to the client instead ("Pas un serveur"). Not a Docker
  # networking issue -- TCP and UDP forwarding were verified working end-to-end.
  tm-dedicated:
    image: pyplanet/maniaplanet-dedicated
    profiles: ["dev"]
    # Quote the /servername argument before handing over to the image's own entrypoint. Upstream's
    # start.sh writes `/servername=${SERVER_NAME} \`, unquoted, so a name with spaces is split by the
    # shell into extra positional arguments and only the first word reaches the server. Patching the
    # line in place (rather than shipping a full copy of start.sh) keeps us on whatever the image
    # ships; if upstream ever fixes or reformats that line the sed simply matches nothing and the
    # container still boots. `$$` escapes compose's own variable interpolation, so sed sees the
    # literal `${SERVER_NAME}` text in the script.
    command: ["sh", "-c", "sed -i 's|/servername=$${SERVER_NAME}|/servername=\"$${SERVER_NAME}\"|' start.sh && exec ./start.sh"]
    env_file:
      - .env
    environment:
      LOGIN: "${TM_DEDICATED_LOGIN}"
      PASSWORD: "${TM_DEDICATED_PASSWORD}"
      TITLE: "TMStadium@nadeo"
      # Spaces here need the `command:` patch further down -- the image's start.sh interpolates
      # SERVER_NAME unquoted, so anything after the first space becomes a separate argument and the
      # name silently truncates ("VelpDev - Come test..." showed up as just "VelpDev").
      SERVER_NAME: "VelpDev - Come test the BetPugin !"
      # Boot on maplist.txt, the playlist PyPlanet actually maintains (//add writes there, and it's
      # bind-mounted below so it survives container recreation). Without this the image's start.sh
      # falls back to `: ${MATCH_SETTINGS:="MatchSettings/default.txt"}` -- the template it generates
      # on first run, which holds a single map. That made every restart look like the playlist had
      # been wiped, when in fact the maps were saved all along and simply never loaded.
      MATCH_SETTINGS: "MatchSettings/maplist.txt"
      # Passed to /forceip; must agree with docker/tm-dedicated-config.txt's <server_port>.
      PORT: "2360"
      # 2026-08-15: this dev server was opened to the internet so several real testers can join and
      # reproduce a multi-player BetPluggin bug that can't be triggered solo. Leaving FORCE_IP_ADDRESS
      # unset makes the entrypoint auto-detect the public/WAN IP and register *that* with the master
      # server -- which is what we now want, and it survives the ISP handing out a new dynamic IP
      # (re-detected on every container start) instead of hardcoding one that silently goes stale.
      #
      # Requires the router to forward 2360 and 3460 (TCP *and* UDP) to this machine. Do NOT forward
      # 5010 -- see the ports section below.
      #
      # Trade-off: joining from this same LAN now depends on the router supporting NAT hairpinning
      # (the master server hands out the public IP even to a client sitting behind that same router).
      # If the local game client can no longer join, that's why.
      #
      # To go back to LAN-only dev, uncomment the line below (set TM_DEDICATED_FORCE_IP in .env to the
      # LAN IPv4 from `ipconfig`) and close the router ports again.
      # FORCE_IP_ADDRESS: "${TM_DEDICATED_FORCE_IP:-127.0.0.1}"
    ports:
      - "2360:2360/tcp"
      - "2360:2360/udp"
      - "3460:3460/tcp"
      - "3460:3460/udp"
      # XML-RPC. Bound to loopback only (2026-08-15, when this server was opened to the internet):
      # it authenticates with SuperAdmin/SuperAdmin in cleartext and grants full control of the
      # dedicated server, so it must never be reachable from the LAN, let alone forwarded by the
      # router. PyPlanet doesn't use this mapping anyway -- it reaches the server as tm-dedicated:5010
      # over the compose network. The mapping only exists for host-side tools (the OnZ Bot's mapupload
      # feature), which run on this machine and so are fine on 127.0.0.1.
      - "127.0.0.1:5010:5010/tcp"
    volumes:
      # See betpluggin service's matching volume comment above -- bind-mounted to the same host
      # folder (./docker/tm-dedicated-userdata, gitignored) so a plain host process (the OnZ Bot's
      # mapupload feature) can write map files here directly too.
      - ./docker/tm-dedicated-userdata:/app/dedicated/UserData
      - ./docker/tm-dedicated-config.txt:/app/dedicated/UserData/Config/config.txt:ro
      # NOTE (2026-08-15): maplist.txt used to be bind-mounted individually here, on the theory that
      # the entrypoint would otherwise wipe the playlist. It doesn't -- start.sh only ever creates
      # MatchSettings/default.txt, and only when that file is missing; maplist.txt is never touched.
      # The mount was redundant (UserData above is already a bind mount, so the file persists through
      # its parent) and it actively broke saving: the server writes a temp file and renames it over
      # maplist.txt, but a single-file bind mount pins that path, so the rename failed and left
      # orphans behind (Gbx9JaZF1, GbxBPCax0, GbxNt7Ju2, GbxUuGqz7 -- every playlist save since
      # 2026-08-03 was silently lost). Keep MatchSettings persisted via the UserData mount only.
    restart: unless-stopped

volumes:
  db-data:
